<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Command Mobile Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,400;0,700;0,800;1,400&display=swap" rel="stylesheet">
<!--
  COMMAND MOBILE PROTOTYPE · XDS-A · single-file, plain JavaScript
  ------------------------------------------------------------------
  HOW IT'S BUILT (read before editing)
  1. <style> is in four parts: XDS TOKENS (copied from XDS-A tokens.css, do not invent values),
     XDS TYPE classes, DEVICE FRAME, APP COMPONENTS. Use var(--token) only; no raw hex in components.
  2. <script> is in five parts: DATA (mock agent data) → STATE → ACTIONS → VIEWS (one function per
     screen/component, each returns an HTML string) → RENDER LOOP (re-renders #app, keeps focus/scroll).
  3. Interactions use data-action="name" (+ optional data-arg) on real <button>s. Add a handler in ACTIONS.
  4. Rules: Mulish only; XDS type classes only; 8px spacing scale; 16px container padding; 4px radius on
     every text button; 44×44 min touch targets; no :hover styles (touch); semantic colors only;
     XDS voice (present tense, verb-first Title Case buttons, no "Please", no dead ends).
  5. Anything beyond XDS is marked "XDS EXTENSION" — keep that tag when you change it.

  DESKTOP: shows a 390×844 phone frame. PHONE (≤ 500px wide): fills the screen, uses real safe areas.

  QA URL PARAMETERS (optional, for testing states without editing code):
    ?list=loading|empty|error   every list screen (Contacts, Tasks, Opportunities, Notifications)
    ?ai=error                   Command AI answers with the error state
    ?accent=solid               swaps the AI gradient (XDS extension) for solid XDS action teal
    ?start=ai|ai-loading|ai-response|contacts|tasks|opps|alerts|menu   open on a given screen
    ?onboarding=value|coachmark|modal Command AI onboarding, shown 1.5s after Home loads: coachmark that opens the
                                value props as Command AI messages (default), coachmark with a short intro, or 5-step modal
    ?tour=off                   hides Command AI onboarding (either version)
-->
<style>
/* =================== XDS TOKENS (XDS-A for Claude v1, light theme) =================== */
:root {
  --kw-neutral-900: rgb(40,43,51); --kw-neutral-700: rgb(61,66,77); --kw-neutral-500: rgb(108,114,126);
  --kw-neutral-200: rgb(228,229,231); --kw-neutral-100: rgb(247,247,248); --kw-neutral-000: rgb(255,255,255);
  --kw-shell-bg: rgb(23,24,28);
  --kw-system: rgb(0,108,132); --kw-system-tint: rgb(213,247,255);
  --kw-red: rgb(197,5,11); --kw-red-tint: rgb(252,220,221);
  --kw-orange: rgb(167,59,6); --kw-orange-tint: rgb(254,223,207);
  --kw-yellow: rgb(153,94,0); --kw-yellow-tint: rgb(255,237,201);
  --kw-green: rgb(2,110,36); --kw-green-tint: rgb(214,242,223);
  --kw-blue: rgb(15,94,173); --kw-blue-tint: rgb(217,239,255);
  --kw-purple: rgb(103,48,180); --kw-purple-tint: rgb(239,232,251);

  --label-primary: rgb(40,43,51); --label-secondary: rgb(61,66,77); --label-tertiary: rgb(108,114,126);
  --label-inverse: rgb(255,255,255);
  --page-background: rgb(247,247,248); --container-background: rgb(255,255,255);
  --container-tinted: rgb(228,229,231); --container-tinted-inverse: rgb(61,66,77);
  --outline: rgba(61,66,77,0.2); --divider: rgba(43,43,51,0.1);
  --action: rgb(0,108,132); --action-hover: rgb(14,78,93); --action-hover-fill: rgba(0,108,132,0.1);
  --action-active: rgb(1,124,152); --action-active-fill: rgba(0,108,132,0.2); --action-focus-outline: rgba(0,108,132,0.3);
  --action-neutral: rgb(61,66,77);
  --overlay-darken: rgba(43,43,51,0.6);
  --status-danger: rgb(197,5,11); --status-warning: rgb(167,59,6); --status-success: rgb(2,110,36);

  --shadow04: 0px 2px 4px 0px rgba(43,43,51,0.05), 0px 0px 1px 0px rgba(43,43,51,0.4);
  --shadow12: 0px 6px 12px 0px rgba(43,43,51,0.05), 0px 3px 6px 0px rgba(43,43,51,0.05), 0px 0px 1px 0px rgba(43,43,51,0.2);
  --shadow32: 0px 16px 32px 0px rgba(43,43,51,0.1), 0px 8px 16px 0px rgba(43,43,51,0.1), 0px 2px 4px 0px rgba(43,43,51,0.1), 0px 0px 1px 0px rgba(43,43,51,0.4);
  --shadow04-inset: inset 0px 2px 4px 0px rgba(43,43,51,0.05), inset 0px 0px 1px 0px rgba(43,43,51,0.4);
  --bar-header: 0px 1px 0px 0px rgba(43,43,51,0.1);
  --bar-footer: 0px -1px 0px 0px rgba(43,43,51,0.1);

  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px; --space-8: 48px;
  --radius-sm: 2px; --radius-md: 4px; --radius-lg: 8px; --radius-xl: 16px; --radius-pill: 999px;
  --font-sans: "Mulish", system-ui, -apple-system, "Segoe UI", sans-serif;

  /* Safe areas: design fallbacks inside the desktop frame; real insets on a phone (see media query) */
  --safe-top: 47px; --safe-bottom: 34px;
  --tabbar-h: 56px;
  /* XDS EXTENSION: AI accent, built only from existing tokens */
  --teal-actionActive: rgb(1,124,152); --blue-actionActive: rgb(18,115,201); --purple-actionActive: rgb(133,68,223);
  --ai-from: var(--purple-actionActive); --ai-mid: var(--blue-actionActive); --ai-to: var(--teal-actionActive);
  --ai-alpha: 50%;
  --ai-gradient: linear-gradient(90deg, color-mix(in srgb, var(--ai-from) var(--ai-alpha), transparent), color-mix(in srgb, var(--ai-mid) var(--ai-alpha), transparent), color-mix(in srgb, var(--ai-to) var(--ai-alpha), transparent));
}

/* =================== XDS TYPE =================== */
.xds-title-xl-bold { font-size: 32px; line-height: 40px; font-weight: 800; }
.xds-title-lg-bold { font-size: 24px; line-height: 32px; font-weight: 800; }
.xds-title-md-bold { font-size: 20px; line-height: 24px; font-weight: 800; }
.xds-title-sm-bold { font-size: 16px; line-height: 20px; font-weight: 700; }
.xds-subtitle-md { font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; }
.xds-text-lg { font-size: 16px; line-height: 24px; font-weight: 400; }
.xds-text-lg-bold { font-size: 16px; line-height: 24px; font-weight: 700; }
.xds-text-md { font-size: 14px; line-height: 20px; font-weight: 400; }
.xds-text-md-bold { font-size: 14px; line-height: 20px; font-weight: 700; }
.xds-text-sm { font-size: 12px; line-height: 16px; font-weight: 400; }
.xds-text-sm-bold { font-size: 12px; line-height: 16px; font-weight: 700; }
.xds-text-xs-bold { font-size: 10px; line-height: 12px; font-weight: 700; }

/* =================== DEVICE FRAME =================== */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font-sans); color: var(--label-primary);
  background: var(--kw-neutral-200);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-3);
  min-height: 100dvh; padding: var(--space-5);
  -webkit-font-smoothing: antialiased;
}
.device {
  width: 390px; height: min(844px, calc(100dvh - 80px)); min-height: 640px;
  border-radius: 48px; border: 10px solid var(--kw-shell-bg);
  box-shadow: var(--shadow32); overflow: hidden; position: relative; background: var(--page-background);
}
.device__caption { color: var(--label-secondary); }
/* iOS status bar + Dynamic Island, drawn over the --safe-top area every header reserves */
.statusbar { position: absolute; top: 0; left: 0; right: 0; height: var(--safe-top); z-index: 40; pointer-events: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 var(--space-6); color: #000; font-family: -apple-system, "SF Pro Text", system-ui, sans-serif; }
.statusbar__time { justify-self: center; font-size: 17px; font-weight: 600; letter-spacing: -0.4px; padding-right: var(--space-4); }
.statusbar__island { width: 124px; height: 36px; border-radius: var(--radius-pill); background: #000; margin-top: 2px; }
.statusbar__icons { justify-self: center; display: flex; align-items: center; gap: 6px; padding-left: var(--space-4); }
.statusbar svg { display: block; }
/* Home indicator, inside the --safe-bottom area the tab bar, composer and sheets reserve */
.home-indicator { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: var(--radius-pill); background: #000; z-index: 40; pointer-events: none; }
@media (max-width: 500px) { .statusbar, .home-indicator { display: none; } }
@media (max-width: 500px) {
  body { padding: 0; background: var(--page-background); }
  .device { width: 100vw; height: 100dvh; min-height: 0; border: 0; border-radius: 0; box-shadow: none; }
  .device__caption { display: none; }
  :root { --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); }
}

/* =================== APP COMPONENTS =================== */
#app { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--page-background); font-size: 14px; line-height: 20px; }
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; cursor: pointer; margin: 0; }
button:disabled { cursor: default; }
input { font: inherit; }
input::placeholder { color: var(--label-tertiary); opacity: 1; }
h1, h2, p { margin: 0; }
:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--action-focus-outline); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg { flex: 0 0 auto; display: block; }

.screen-area { flex: 1 1 auto; min-height: 0; position: relative; display: flex; flex-direction: column; }
.screen { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; scrollbar-width: none; padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-5); }
.scroll::-webkit-scrollbar, .hscroll::-webkit-scrollbar { display: none; }
.hscroll { display: flex; gap: var(--space-2); overflow-x: auto; scrollbar-width: none; margin: 0 calc(var(--space-4) * -1); padding: 0 var(--space-4); }

/* AppHeader */
.header { background: var(--container-background); box-shadow: var(--bar-header); padding: var(--safe-top) var(--space-4) 0; position: relative; z-index: 1; flex: 0 0 auto; }
.header--tight { padding-left: var(--space-2); padding-right: var(--space-2); }
.header__row { min-height: 64px; display: flex; align-items: center; gap: var(--space-2); }
.header__row--sm { min-height: 56px; gap: var(--space-1); }
.header__titles { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; margin-left: var(--space-1); }
.header__title { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.header__sub { display: flex; align-items: center; gap: var(--space-1); color: var(--label-secondary); }
.header__extra { padding-bottom: var(--space-3); }

/* Buttons: 4px radius on every text variant, 44px min */
.btn { min-height: 44px; padding: var(--space-2) var(--space-4); border: 0; border-radius: var(--radius-md); font-size: 14px; line-height: 20px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); }
.btn--block { background: var(--action); color: var(--label-inverse); }
.btn--block:active { background: var(--action-active); }
.btn--bordered { background: var(--container-background); color: var(--action); border: 1px solid var(--action); }
.btn--bordered:active, .btn--borderless:active { background: var(--action-hover-fill); }
.btn--borderless { background: transparent; color: var(--action); padding: 0 var(--space-2); }
.btn--danger-bordered { background: var(--container-background); color: var(--kw-red); border: 1px solid var(--kw-red); }
.btn--full { width: 100%; }
.icon-btn { width: 44px; height: 44px; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--label-secondary); display: inline-flex; align-items: center; justify-content: center; padding: 0; flex: 0 0 auto; }
.icon-btn:active { background: var(--action-hover-fill); }
.icon-btn--action { color: var(--action); }
.icon-btn.is-on { color: var(--action); }

/* Avatar */
.avatar { width: 40px; height: 40px; flex: 0 0 auto; border-radius: var(--radius-pill); background: var(--container-tinted); color: var(--label-secondary); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
.avatar--brand { background: var(--kw-system-tint); color: var(--kw-system); }
.avatar--lg { width: 64px; height: 64px; font-size: 20px; font-weight: 800; }

/* Chip / Badge (tone set via --c / --bg) */
.chip { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: var(--radius-pill); background: var(--bg); color: var(--c); font-size: 12px; line-height: 16px; font-weight: 700; white-space: nowrap; flex: 0 0 auto; }
.badge { display: inline-flex; align-items: center; gap: var(--space-1); padding: 4px 8px; border-radius: var(--radius-sm); background: var(--bg); color: var(--c); font-size: 10px; line-height: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; align-self: flex-start; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: var(--radius-pill); background: var(--c); }
.tone-system { --c: var(--kw-system); --bg: var(--kw-system-tint); }
.tone-success { --c: var(--kw-green); --bg: var(--kw-green-tint); }
.tone-warning { --c: var(--kw-orange); --bg: var(--kw-orange-tint); }
.tone-info { --c: var(--kw-blue); --bg: var(--kw-blue-tint); }
.tone-pending { --c: var(--kw-yellow); --bg: var(--kw-yellow-tint); }
.tone-danger { --c: var(--kw-red); --bg: var(--kw-red-tint); }
.tone-neutral { --c: var(--label-secondary); --bg: var(--kw-neutral-200); }

/* Suggestion chips (36px pill inside a 44px tap row) — XDS EXTENSION: pill radius matches source */
.suggestion { flex: 0 0 auto; min-height: 44px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; }
.suggestion span { display: inline-flex; align-items: center; height: 36px; padding: 0 var(--space-4); border-radius: var(--radius-pill); border: 1px solid var(--outline); background: var(--container-background); font-weight: 700; white-space: nowrap; }
.suggestion:active span { background: var(--action-hover-fill); }

/* Sections */
.section { display: flex; flex-direction: column; gap: var(--space-3); }
.section__title { display: flex; align-items: center; gap: var(--space-2); color: var(--label-secondary); }

/* AI entry field + composer ring — XDS EXTENSION: purple→teal gradient (XDS lists this as an anti-pattern; kept to match source). ?accent=solid swaps it. */
.ai-ring { border: 1px solid transparent; background: linear-gradient(var(--container-background), var(--container-background)) padding-box, var(--ai-gradient) border-box; }
.ai-ring.is-focused { border-width: 2px; }
.accent-solid .ai-ring { border: 1px solid var(--outline); background: var(--container-background); }
.accent-solid .ai-ring.is-focused { border-color: var(--action); box-shadow: 0 0 0 2px var(--action-focus-outline); }
.ai-send { width: 44px; height: 44px; flex: 0 0 auto; border: 0; border-radius: var(--radius-pill); color: var(--label-inverse); display: flex; align-items: center; justify-content: center; background: var(--ai-gradient); } /* XDS EXTENSION: circular icon button */
.accent-solid .ai-send { background: var(--action); }
.ai-send:disabled { opacity: 0.4; }
.spark-solid { display: none; }
.spark-solid.is-solid { display: block; }
.ai-entry .spark-gradient { --ai-alpha: 100%; } /* Home dashboard sparkle stays fully opaque; the ring keeps 50% */
.accent-solid .spark-gradient { display: none; }
.accent-solid .spark-solid { display: block; }

.ai-entry { width: 100%; min-height: 52px; border-radius: var(--radius-pill); display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-1) 0 var(--space-4); text-align: left; box-shadow: var(--shadow04); }
.ai-entry__placeholder { flex: 1 1 auto; color: var(--label-tertiary); }
/* Cycling placeholder: current prompt rises + fades out, the next rises in from below */
.ph-wrap { position: relative; flex: 1 1 auto; min-width: 0; height: 24px; overflow: hidden; }
.ph { position: absolute; left: 0; right: 0; top: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--label-tertiary); pointer-events: none; transition: opacity .4s ease, transform .4s cubic-bezier(.16,1,.3,1); }
.ph.is-out { opacity: 0; transform: translateY(-6px); }
.ph.is-in { opacity: 0; transform: translateY(6px); transition: none; }
.composer__field { position: relative; flex: 1 1 auto; min-width: 0; display: flex; }
.composer__field .ph { top: 12px; }
.composer.is-focused .ph, .composer__field.has-draft .ph { visibility: hidden; }
@media (prefers-reduced-motion: reduce) { .ph { transition: none; } }
.ai-entry__mic { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--action-neutral); }

/* StatTile */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-2); }
.tile { min-height: 96px; padding: var(--space-3); border-radius: var(--radius-lg); border: 1px solid var(--outline); background: var(--bg); display: flex; flex-direction: column; justify-content: space-between; text-align: left; }
.tile:active { box-shadow: var(--shadow04-inset); }
.tile__top { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-1); width: 100%; color: var(--c); }
.tile__label { color: var(--kw-neutral-900); } /* stays legible on tints in any theme */
.tile__count { align-self: flex-end; color: var(--c); }

/* SegmentCard */
.segments { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-2); }
.card { border: 0; border-radius: var(--radius-lg); background: var(--container-background); box-shadow: var(--shadow12); }
button.card:active { box-shadow: var(--shadow04-inset); }
.segment { min-height: 112px; padding: var(--space-3) var(--space-4); display: flex; flex-direction: column; gap: var(--space-1); text-align: left; }
.segment__top, .segment__bottom { display: flex; justify-content: space-between; gap: var(--space-2); width: 100%; }
.segment__top { align-items: flex-start; }
.segment__bottom { margin-top: auto; align-items: flex-end; }
.segment__window { color: var(--label-tertiary); min-height: 16px; }
.segment__meta { color: var(--label-secondary); }
.segment__count { color: var(--action); }
.segment--lead .segment__meta, .segment--lead .segment__count { color: var(--status-danger); }
.lead-mark { width: 24px; height: 24px; flex: 0 0 auto; border-radius: var(--radius-pill); background: var(--kw-red); color: var(--label-inverse); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }

/* PipelineStrip */
.pipeline { overflow-x: auto; scrollbar-width: none; }
.pipeline__inner { display: flex; gap: var(--space-1); padding: var(--space-2); width: max-content; }
.stage { min-width: 104px; min-height: 72px; padding: var(--space-2) var(--space-3); border: 0; border-radius: var(--radius-md); background: transparent; display: flex; flex-direction: column; gap: var(--space-1); text-align: left; }
.stage:active { background: var(--action-hover-fill); }
.stage__count { color: var(--action); }
.stage__label { color: var(--label-secondary); white-space: nowrap; }

/* FAB — XDS EXTENSION: circular icon-only button (source screens); text buttons stay 4px */
.fab { position: absolute; right: var(--space-4); bottom: var(--space-4); width: 56px; height: 56px; border: 0; border-radius: var(--radius-pill); background: var(--action); color: var(--label-inverse); box-shadow: var(--shadow12); display: flex; align-items: center; justify-content: center; z-index: 2; }
.fab:active { background: var(--action-active); }

/* Lists */
.list-group { border-radius: var(--radius-lg); background: var(--container-background); box-shadow: var(--shadow12); overflow: hidden; }
.list-title { padding: var(--space-4) var(--space-4) var(--space-2); color: var(--label-secondary); }
.row { width: 100%; min-height: 64px; display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); border: 0; border-bottom: 1px solid var(--divider); background: var(--container-background); text-align: left; }
.row:last-child { border-bottom: 0; }
button.row:active { background: var(--action-hover-fill); }
.row__body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row__title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row__meta { color: var(--label-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.count-label { color: var(--label-tertiary); }
.stack-8 { display: flex; flex-direction: column; gap: var(--space-2); }
.stack-12 { display: flex; flex-direction: column; gap: var(--space-3); }

/* SearchField (XDS Input) */
.field { display: flex; align-items: center; gap: var(--space-2); min-height: 44px; padding: 0 var(--space-3); border-radius: var(--radius-md); background: var(--container-background); box-shadow: inset 0 0 0 1px var(--outline); color: var(--label-tertiary); }
.field:focus-within { box-shadow: inset 0 0 0 1px var(--action), 0 0 0 2px var(--action-focus-outline); }
.field input { flex: 1 1 auto; min-width: 0; border: 0; outline: none; background: transparent; color: var(--label-primary); padding: 10px 0; font-size: 16px; line-height: 24px; }
.field input:focus-visible { box-shadow: none; }
.field input::-webkit-search-cancel-button { display: none; }

/* TaskRow */
.task { display: flex; align-items: flex-start; gap: var(--space-2); padding: var(--space-2) var(--space-4) var(--space-3) var(--space-2); border-bottom: 1px solid var(--divider); }
.task:last-child { border-bottom: 0; }
.check { width: 44px; height: 44px; flex: 0 0 auto; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0; }
.check__box { width: 22px; height: 22px; border-radius: var(--radius-md); border: 2px solid var(--action-neutral); background: var(--container-background); color: var(--label-inverse); display: flex; align-items: center; justify-content: center; }
.task.is-done .check__box { border-color: var(--action); background: var(--action); }
.task__body { flex: 1 1 auto; min-width: 0; padding-top: var(--space-3); display: flex; flex-direction: column; gap: var(--space-1); }

.sheet__head { min-height: 52px; display: flex; align-items: center; gap: var(--space-2); }
.sheet__head h2 { flex: 1 1 auto; }
.sheet__head .icon-btn { margin-right: -12px; }
.sheet__intro { color: var(--label-secondary); margin-bottom: var(--space-2); }
.sheet__rows { overflow-y: auto; display: flex; flex-direction: column; }
.sheet-row { width: 100%; min-height: 56px; display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-1); border: 0; border-bottom: 1px solid var(--divider); background: transparent; text-align: left; }
.sheet-row:active { background: var(--action-hover-fill); }
.sheet-row__body { flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px; }
.sheet-row__meta { color: var(--label-tertiary); }
.mark { width: 22px; height: 22px; border-radius: var(--radius-md); border: 2px solid var(--action-neutral); background: var(--container-background); display: flex; align-items: center; justify-content: center; color: var(--label-inverse); }
.mark--radio { border-radius: var(--radius-pill); }
[aria-checked="true"] .mark { border-color: var(--action); background: var(--action); }
.mark__dot { width: 8px; height: 8px; border-radius: var(--radius-pill); background: var(--label-inverse); }
.chev { color: var(--label-tertiary); }
.sheet .btn--block { margin-top: var(--space-4); }

/* Toast */
.toast { position: absolute; left: var(--space-4); right: var(--space-4); bottom: calc(var(--tabbar-h) + var(--safe-bottom) + var(--space-4)); z-index: 30; padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); background: var(--container-tinted-inverse); color: var(--label-inverse); box-shadow: var(--shadow12); font-weight: 700; animation: fade-in 180ms cubic-bezier(0,0,.2,1); }

/* Motion: functional and quick (XDS); one-shot classes are added only on the render that opens a layer */
@keyframes shimmer { from { background-position: -240px 0; } to { background-position: 240px 0; } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes sheet-in { from { transform: translateY(100%); } to { transform: none; } }
@keyframes push-in { from { transform: translateX(100%); } to { transform: none; } }
@keyframes rise-in { from { transform: translateY(32px); opacity: 0; } to { transform: none; opacity: 1; } }
.anim-sheet { animation: sheet-in 240ms cubic-bezier(0,0,.2,1); }
.anim-fade { animation: fade-in 200ms cubic-bezier(0,0,.2,1); }
.anim-push { animation: push-in 260ms cubic-bezier(0,0,.2,1); }
.anim-rise { animation: rise-in 220ms cubic-bezier(0,0,.2,1); }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; } }
</style>

// Types the next intro message, then keeps going until one waits for a reply or the intro ends.
// Each message lands together with the next typing indicator, so earlier messages don't re-animate between renders.
function playIntro() {
  const next = () => {
    if (!state.ai.open) return;
    const line = intro.lines[intro.k++];
    const end = intro.k === intro.lines.length;
    state.ai.messages.push({ role: 'ai', intro: true, ...line, introEnd: end });

    once.introNew = true; once.aiBottom = true; render();
    if (state.ai.phase === 'typing') timers.intro = setTimeout(next, 900 + line.text.length * (line.step ? 14 : 8));
  };

  }

  { name: 'The big idea', title: 'Answers your questions. Acts on your\u00a0behalf.',
    body: 'Command AI answers questions about your contacts, your market, and your business. Then it takes care of the work that comes after, like adding contacts and setting tasks.',
    chat: 'I answer questions about your contacts, your market, and your business. Then I take care of the work that comes after, like adding contacts and setting tasks.' },
  { name: 'Know where to focus', title: 'Start your day with who to call',
    body: 'Get a short list of contacts worth calling today, along with why each one made the list. Spend your time on conversations, not on sorting your database.',
    chat: 'Ask me and I’ll give you a short list of contacts worth calling today, along with why each one made the list.',
    prompt: 'Who should I call today?' },
  { name: 'Walk in prepared', title: 'Know your market before the conversation',
    body: 'Pull up prices, inventory, and recent activity for any area in seconds, so you’re ready when a client asks how things are moving.',
    chat: 'I pull up prices, inventory, and recent activity for any area in seconds, so you’re ready when a client asks how things are moving.',
    prompt: 'How’s the market in Santa Monica?' },
  { name: 'Hand off the busywork', title: 'Ask, and it’s done',
    body: 'Create a contact, add them to a SmartPlan, set a follow-up task, or find your listings without clicking through screens. Tell Command AI what you need in plain words.',
    chat: 'Tell me what you need in plain words. I’ll create the contact, add them to a SmartPlan, or set the follow-up task, without you clicking through screens.',
    prompt: 'Add Devon Kirk to my new buyer SmartPlan' },
  { name: 'You stay in charge', title: 'You approve every change',
    body: 'Command AI shows you what it’s about to do before anything in Command changes. And if you’re ever stuck, ask how anything works.',
    chat: 'I show you what I’m about to do before anything in Command changes. And if you’re ever stuck, ask me how anything works.' }
];

function onbGo(step) {
  state.onboard.step = Math.max(0, Math.min(ONB_STEPS.length - 1, step));
  once.onbStep = true; once.focus = 'onb-primary';
}
function closeOnboard() { state.onboard.open = false; }

function onbStage(step) {
  const frag = (style, tone, ic, title, sub, delay) => `<div class="frag float xds-text-sm-bold" style="${style};animation-delay:${delay}s"><span class="frag__ic tone-${tone}">${icon(ic, 14)}</span><span>${title}<small>${sub}</small></span></div>`;
  const done = (i, title, sub) => `<div class="onb-row"><span class="onb-done" style="animation-delay:${150 + i * 220}ms">${icon('check', 12, 3)}</span><span class="onb-row__body"><span class="xds-text-sm-bold">${title}</span><span class="xds-text-sm onb-row__sub">${sub}</span></span></div>`;
  if (step === 0) return `<div class="onb-hello"><div class="onb-swap">
      <span class="onb-swap__item"><span class="onb-tile tone-info">${icon('history', 20)}</span><span class="xds-text-sm-bold onb-swap__cap">Answers</span></span>
      <span class="onb-swap__item"><span class="onb-hero">${sparkWhite(26)}</span><span class="xds-text-sm-bold onb-swap__cap onb-swap__cap--new">Command AI</span></span>
      <span class="onb-swap__item"><span class="onb-tile tone-success">${icon('check', 20, 2.5)}</span><span class="xds-text-sm-bold onb-swap__cap">Acts</span></span></div>
    <div class="onb-chips onb-chips--center">${['Contacts', 'Tasks', 'SmartPlans'].map((t, i) => `<span class="onb-chip float" style="animation-delay:${-i}s">${icon('plus', 12, 3)}${t}</span>`).join('')}</div></div>`;
  if (step === 1) {
    const lead = (n, c, why, top) => `<div class="onb-row${top ? ' is-top' : ''}"><span class="xds-text-sm-bold onb-row__rank">${n}</span><span class="avatar avatar--sm">${c.initials}</span><span class="onb-row__body"><span class="xds-text-sm-bold">${c.name}</span><span class="xds-text-sm onb-row__sub">${why}</span></span>${icon('chevronRight', 12)}</div>`;
    return `<div class="onb-card">${lead(1, contactById.c1, 'Toured 412 Maple Ave yesterday', true)}${lead(2, contactById.c3, 'Ready to offer on 88 Oak St')}${lead(3, contactById.c2, 'Pre-approval expires Friday')}</div>`;
  }
  if (step === 2) {
    const stat = (value, label, delta) => `<div class="onb-stat"><span class="xds-title-sm-bold">${value}</span><span class="xds-text-sm onb-stat__label">${label}</span>${delta ? `<span class="xds-text-sm-bold onb-stat__delta">${delta}</span>` : ''}</div>`;
    return `<div class="onb-card"><div class="onb-card__head xds-text-sm-bold">Santa Monica<span class="xds-text-sm">Last 30 days</span></div>
      <div class="onb-stats">${stat('$1.9M', 'Median price', '↑ 4%')}${stat('212', 'Active listings', '↑ 12')}${stat('24', 'Days on market', '↓ 3')}</div></div>`;
  }
  if (step === 3) return `<div class="onb-card">${done(0, 'Contact created', 'Devon Kirk')}${done(1, 'Added to SmartPlan', 'New Buyer')}${done(2, 'Follow-up task set', 'Call Devon, Friday at 10 AM')}</div>`;
  return `<div class="onb-card"><div class="onb-card__head xds-text-sm-bold"><span class="onb-card__title">${icon('shield', 14)}Review before saving</span><span class="xds-text-sm">2 changes</span></div>
    <div class="onb-row"><span class="onb-change">${icon('plus', 12, 3)}</span><span class="xds-text-sm onb-row__body">Add Devon Kirk to New Buyer SmartPlan</span></div>
    <div class="onb-row"><span class="onb-change">${icon('plus', 12, 3)}</span><span class="xds-text-sm onb-row__body">Task: Call Devon, Friday at 10 AM</span></div>
    <div class="onb-chips onb-chips--card"><span class="onb-chip">Edit</span><span class="onb-chip is-on">${icon('check', 12, 3)}Approve</span></div></div>`;
}

function onbBody(step) {
  const s = ONB_STEPS[step];
  return `<p class="xds-subtitle-md onb__eyebrow">${s.name}</p>
    <h2 id="onb-title" class="${step === 0 ? 'xds-title-lg-bold' : 'xds-title-md-bold'}">${s.title}</h2>
    <p class="xds-text-md onb__lede">${s.body}</p>` +
    (s.prompt ? `<div class="onb-try"><span class="xds-text-sm onb-try__label">Try asking</span><button type="button" class="onb-ask ai-ring xds-text-md" ${btnAttr('onbTry', s.prompt)}>${sparkle(18)}<span class="onb-ask__text">${esc(s.prompt)}</span>${icon('send', 16)}</button></div>` : '');
}

function viewOnboard() {
  const o = state.onboard, last = ONB_STEPS.length - 1;
  const dots = ONB_STEPS.map((_, i) => `<i class="${i === o.step ? 'is-on' : i < o.step ? 'is-done' : ''}"></i>`).join('');
  const chevron = icon('chevronRight', 14);
  const buttons = o.step === 0
    ? `<button type="button" class="btn btn--borderless" ${btnAttr('onbClose')}>Skip for Now</button><button type="button" id="onb-primary" class="btn btn--block" ${btnAttr('onbNext')}>Show me${chevron}</button>`
    : `<button type="button" class="btn btn--borderless" ${btnAttr('onbBack')}>Back</button>` + (o.step === last
      ? `<button type="button" id="onb-primary" class="btn btn--block" ${btnAttr('onbFinish')}>Start asking</button>`
      : `<button type="button" id="onb-primary" class="btn btn--block" ${btnAttr('onbNext')}>Next${chevron}</button>`);
  return `<div class="onb-layer">
    <button type="button" class="onb-scrim${once.onbOpen ? ' anim-fade-200' : ''}" ${btnAttr('onbClose')} aria-label="Close onboarding" tabindex="-1"></button>
    <div class="onb${once.onbOpen ? ' anim-pop' : ''}" role="dialog" aria-modal="true" aria-labelledby="onb-title">
      <div class="onb__stage">
        <span class="onb__badge xds-text-sm-bold"><span class="onb__badge-dot">${sparkWhite(12)}</span>Command AI</span>
        <button type="button" class="icon-btn onb__close" ${btnAttr('onbClose')} aria-label="Close onboarding">${icon('close', 16)}</button>
        ${onbStage(o.step)}
      </div>
      <div class="onb__body${once.onbStep || once.onbOpen ? ' anim-step' : ''}">${onbBody(o.step)}</div>
      <div class="onb__foot">
        <span class="onb__progress" aria-label="Step ${o.step + 1} of ${ONB_STEPS.length}: ${ONB_STEPS[o.step].name}">${dots}<span class="xds-text-sm onb__count">${o.step + 1} of ${ONB_STEPS.length}</span></span>
        ${buttons}
      </div>
    </div>
  </div>`;
}

/* Product tour step, anchored under the Home AI entry */
function viewTour() {
  return `<div class="tour-anchor"><div class="tour" role="dialog" aria-labelledby="tour-body">
    <div class="tour__head">
      ${QA.onboarding === 'value'
        ? `<div class="tour__body"><span class="xds-text-sm-bold tour__new">${sparkWhite(12)}New</span><p id="tour-body" class="xds-text-lg">Meet Command AI. It answers your questions and acts on your behalf, like adding contacts and setting tasks.</p></div>`
        : `<p id="tour-body" class="xds-text-lg tour__body">Meet Command AI. It answers your questions and acts on your behalf, like adding contacts and setting tasks. Start by tapping the input.</p>`}
      <button type="button" class="icon-btn" ${btnAttr('closeTour')} aria-label="Close tour">${icon('close', 18)}</button>
    </div>
    <div class="tour__actions">
      <button type="button" class="btn btn--borderless" ${btnAttr('closeTour')}>Cancel</button>
      <button type="button" class="btn btn--inverse" ${btnAttr('learnMore')}>Learn More</button>
    </div>
  </div></div>`;
}

function suggestionRow(list = DATA.suggestions, action = 'ask') {
  return `<div class="hscroll" role="list" aria-label="${action === 'ask' ? 'Suggested prompts' : 'Quick replies'}">${list.map((q) =>
    `<button type="button" class="suggestion" role="listitem" ${btnAttr(action, q)}><span>${esc(q)}</span></button>`).join('')}</div>`;
}

/* ListState: loading skeleton / empty / error, shared by every list screen */
function listState({ name, emptyTitle, emptyBody, emptyCta, emptyCtaLabel }) {
  if (state.listState === 'loading') {
    return `<div class="list-group" aria-busy="true" aria-label="Loading ${name}">${[1, 2, 3, 4, 5, 6].map(() =>
      `<div class="skel-row"><span class="skeleton skeleton--circle"></span><span class="skel-lines"><span class="skeleton" style="width:62%"></span><span class="skeleton" style="width:38%;height:10px"></span></span></div>`).join('')}</div>`;
  }
  if (state.listState === 'error') {
    const title = name.charAt(0).toUpperCase() + name.slice(1);
    return `<div class="state state--error" role="alert"><span style="color:var(--status-danger)">${icon('error', 40)}</span>
      <p class="xds-title-sm-bold state__title">${title} Didn’t Load</p>
      <p class="xds-text-md">Check your connection, then try again.</p>
      <button type="button" class="btn btn--bordered" ${btnAttr('retry')}>Try Again</button></div>`;
  }
  if (state.listState === 'empty') {
    return `<div class="state"><p class="xds-title-sm-bold">${emptyTitle}</p><p class="xds-text-md">${emptyBody}</p>
      ${emptyCta ? `<button type="button" class="btn btn--block" ${btnAttr('sheet', 'create')}>${emptyCtaLabel}</button>` : ''}</div>`;
  }
  return null; // loaded
}

/* ---------- Home (Dashboard) ---------- */
function viewHome() {
  const open = DATA.tasks.filter((t) => !state.done[t.id]);
  const count = (d) => open.filter((t) => t.due === d).length;
  const tile = (due, label, tone, ic) => `
    <button type="button" class="tile tone-${tone}" ${btnAttr('tasksFilter', due)} aria-label="${count(due)} tasks ${label.toLowerCase()}">
      <span class="tile__top"><span class="xds-title-sm-bold tile__label">${label}</span>${ic ? icon(ic, 20) : ''}</span>
      <span class="xds-title-lg-bold tile__count">${count(due)}</span>
    </button>`;
  const segments = DATA.segments.map((g) => `
    <button type="button" class="card segment${g.isLead ? ' segment--lead' : ''}" ${btnAttr('tab', 'contacts')}>
      <span class="segment__top"><span class="xds-title-sm-bold">${g.title}</span>${g.isLead ? '<span class="lead-mark" aria-hidden="true">L</span>' : ''}</span>
      <span class="xds-text-sm segment__window">${g.window || ''}</span>
      <span class="segment__bottom"><span class="xds-text-md segment__meta"${g.isLead ? ' data-countdown' : ''}>${g.isLead ? claimLabel() : g.meta}</span><span class="xds-title-lg-bold segment__count">${g.count}</span></span>
    </button>`).join('');
  const stages = DATA.stages.map((s) => `
    <button type="button" class="stage" ${btnAttr('stageGo', s.key)}><span class="xds-title-lg-bold stage__count">${s.count}</span><span class="xds-text-sm stage__label">${s.label || s.key}</span></button>`).join('');
  const none = !state.layout.tasks && !state.layout.contact && !state.layout.opps;

  return `<div class="screen">
    ${header(`
      <span class="avatar avatar--brand" aria-hidden="true">${DATA.agent.initials}</span>
      <div class="header__titles"><h1 class="xds-title-sm-bold header__title">${DATA.agent.team}</h1><span class="xds-text-sm header__sub">${icon('team', 16)}${DATA.agent.role}</span></div>
      <button type="button" class="btn btn--borderless" ${btnAttr('sheet', 'layout')}>Manage Layout</button>`)}
    <div class="scroll" data-scroll="home" style="padding-bottom:96px">
      <div class="stack-8">
        <button type="button" class="ai-entry ai-ring" ${btnAttr('openAi')} aria-label="Ask Command AI">
          ${sparkle(24)}<span class="ai-entry__placeholder ph-wrap">${phSpan()}</span><span class="ai-entry__mic" aria-hidden="true">${icon('mic', 24)}</span>
        </button>
        ${state.tour ? viewTour() : ''}
        ${suggestionRow()}
      </div>
      ${state.layout.tasks ? `<section class="section" aria-labelledby="h-tasks">
        <h2 id="h-tasks" class="xds-subtitle-md section__title">${icon('tasks', 20)}Tasks</h2>
        <div class="tiles">${tile('today', 'Due Today', 'system')}${tile('soon', 'Due Soon', 'warning', 'hourglass')}${tile('past', 'Past Due', 'danger', 'alert')}</div>
      </section>` : ''}
      ${state.layout.contact ? `<section class="section" aria-labelledby="h-who">
        <h2 id="h-who" class="xds-subtitle-md section__title">${icon('contacts', 20)}Who to Contact</h2>
        <div class="segments">${segments}</div>
      </section>` : ''}
      ${state.layout.opps ? `<section class="section" aria-labelledby="h-opps">
        <h2 id="h-opps" class="xds-subtitle-md section__title">${icon('opportunities', 20)}Open Opportunities</h2>
        <div class="card pipeline"><div class="pipeline__inner">${stages}</div></div>
      </section>` : ''}
      ${none ? `<div class="state"><p class="xds-title-sm-bold">Your Dashboard Is Empty</p><p class="xds-text-md">Turn sections back on to see your day at a glance.</p><button type="button" class="btn btn--block" ${btnAttr('sheet', 'layout')}>Manage Layout</button></div>` : ''}
    </div>
    <button type="button" class="fab" ${btnAttr('sheet', 'create')} aria-label="Create">${icon('plus', 28)}</button>
  </div>`;
}

/* ---------- Contacts ---------- */
function viewContacts() {
  const q = state.query.trim().toLowerCase();
  const rows = DATA.contacts.filter((c) => !q || `${c.name} ${c.tag} ${c.summary}`.toLowerCase().includes(q));
  const ls = listState({ name: 'contacts', emptyTitle: 'No Contacts Yet', emptyBody: 'Add your first contact to start building your pipeline.', emptyCta: true, emptyCtaLabel: 'Create Contact' });
  const body = ls || `<div class="stack-8">
    <p class="xds-text-sm count-label">${q ? `${rows.length} of ${DATA.contacts.length} contacts` : `${DATA.contacts.length} contacts`}</p>
    ${rows.length ? `<div class="list-group">${rows.map((c) => `
      <button type="button" class="row" ${btnAttr('openContact', c.id)}>
        <span class="avatar" aria-hidden="true">${c.initials}</span>
        <span class="row__body"><span class="xds-text-lg-bold row__title">${c.name}</span><span class="xds-text-sm row__meta">${c.summary}</span></span>
        <span class="chip tone-${c.tone}">${c.tag}</span>
      </button>`).join('')}</div>`
    : `<div class="state"><p class="xds-title-sm-bold">No Matches</p><p class="xds-text-md">Try a first name, last name, or tag.</p><button type="button" class="btn btn--borderless" ${btnAttr('clearQuery')}>Clear Search</button></div>`}
  </div>`;
  return `<div class="screen">
    ${header(`<h1 class="xds-title-lg-bold header__title">Contacts</h1>
      <button type="button" class="icon-btn icon-btn--action" ${btnAttr('sheet', 'create')} aria-label="Create Contact">${icon('addCircle', 24)}</button>`,
      { extra: `<label class="field"><span class="sr-only">Search contacts</span>${icon('search', 20)}<input id="contact-search" type="search" data-input="query" placeholder="Search Contacts…" value="${esc(state.query)}" autocomplete="off"></label>` })}
    <div class="scroll" data-scroll="contacts">${body}</div>
  </div>`;
}

/* ---------- Tasks ---------- */
function viewTasks() {
  const rows = DATA.tasks.filter((t) => state.taskFilter === 'all' || t.due === state.taskFilter);
  let body = listState({ name: 'tasks', emptyTitle: 'You’re All Caught Up', emptyBody: 'No tasks match this filter. Create one to keep deals moving.', emptyCta: true, emptyCtaLabel: 'Create Task' });
  if (!body && !rows.length) body = `<div class="state"><span style="color:var(--status-success)">${icon('checkCircle', 40)}</span><p class="xds-title-sm-bold">You’re All Caught Up</p><p class="xds-text-md">No tasks match this filter. Create one to keep deals moving.</p><button type="button" class="btn btn--block" ${btnAttr('sheet', 'create')}>Create Task</button></div>`;
  if (!body) body = `<div class="list-group">${rows.map((t) => {
    const done = !!state.done[t.id]; const d = DUE[t.due];
    return `<div class="task${done ? ' is-done' : ''}">
      <button type="button" class="check" ${btnAttr('toggleTask', t.id)} aria-pressed="${done}" aria-label="${done ? 'Mark not done' : 'Complete'}: ${esc(t.title)}">
        <span class="check__box">${done ? icon('check', 14, 3) : ''}</span></button>
      <div class="task__body"><span class="xds-text-md-bold task__title">${t.title}</span>
        <span class="xds-text-sm row__meta">${contactById[t.contactId].name} · ${t.when}</span>
        <span class="badge tone-${d.tone}">${d.label}</span></div>
    </div>`; }).join('')}</div>`;
  return `<div class="screen">
    ${header(`<h1 class="xds-title-lg-bold header__title">Tasks</h1>
      <button type="button" class="btn btn--bordered" ${btnAttr('sheet', 'taskFilter')} aria-haspopup="dialog">${FILTERS[state.taskFilter]}${icon('chevronDown', 16)}</button>`)}
    <div class="scroll" data-scroll="tasks">${body}</div>
  </div>`;
}

/* ---------- Opportunities ---------- */
function viewOpps() {
  const rows = DATA.opps.filter((o) => state.stageFilter === 'All' || o.stage === state.stageFilter);
  const chips = ['All', 'Cultivate', 'Appointment', 'Active', 'Under Contract'].map((k) =>
    `<button type="button" class="filter-chip" ${btnAttr('stageFilter', k)} aria-pressed="${state.stageFilter === k}"><span>${k}</span></button>`).join('');
  const body = listState({ name: 'opportunities', emptyTitle: 'No Open Opportunities', emptyBody: 'Turn a contact into a buyer, listing, or lease to track it here.', emptyCta: true, emptyCtaLabel: 'Create Opportunity' })
    || `<div class="stack-12"><div class="hscroll">${chips}</div>
      ${rows.length ? rows.map((o) => `
        <button type="button" class="card opp" ${btnAttr('openContact', o.contactId)}>
          <span class="opp__top"><span class="xds-text-lg-bold">${o.contact}</span><span class="badge tone-${STAGE_TONE[o.stage]}">${o.stage}</span></span>
          <span class="xds-text-md" style="color:var(--label-secondary)">${o.type} · ${o.property}</span>

  return `<div class="screen">${header(`<h1 class="xds-title-lg-bold header__title">Opportunities</h1>`)}<div class="scroll" data-scroll="opps">${body}</div></div>`;
}

/* ---------- Notifications ---------- */

      <button type="button" class="row row--top${state.read[n.id] ? '' : ' is-unread'}" ${btnAttr('readAlert', n.id)}>

    ${header(`<h1 class="xds-title-lg-bold header__title">Notifications</h1>${unread && state.listState === 'loaded' ? `<button type="button" class="btn btn--borderless" ${btnAttr('markAllRead')}>Mark All Read</button>` : ''}`)}

/* ---------- TabBar ---------- */
function viewTabBar() {
  const unread = DATA.alerts.filter((n) => !state.read[n.id]).length;
  const tab = (key, label, ic, size) => `<button type="button" class="tab" ${btnAttr('tab', key)} aria-label="${label}" aria-current="${state.tab === key ? 'page' : 'false'}">
    <span class="tab__icon">${icon(ic, size)}${key === 'alerts' && unread ? `<span class="tab__badge" aria-hidden="true">${unread}</span>` : ''}</span></button>`;

    ${tab('home', 'Home', 'home', 26)}${tab('contacts', 'Contacts', 'contacts', 24)}${tab('tasks', 'Tasks', 'tasks', 28)}

  </nav>`;
}

/* ---------- Contact Detail (stack push) ---------- */
function viewContactDetail(id) {
  const c = contactById[id];
  const first = c.name.includes('&') ? c.name : c.name.split(' ')[0];
  const tasks = DATA.tasks.filter((t) => t.contactId === id && !state.done[t.id]);
  return `<div class="layer layer--push${once.push ? ' anim-push' : ''}" role="region" aria-label="${esc(c.name)}">
    ${header(`<button type="button" class="icon-btn icon-btn--action" ${btnAttr('back')} aria-label="Back">${icon('back', 24)}</button><h1 class="xds-title-md-bold header__title">${c.name}</h1>`, { tight: true })}
    <div class="scroll scroll--detail" data-scroll="detail-${id}">
      <div class="detail-head"><span class="avatar avatar--lg" aria-hidden="true">${c.initials}</span>
        <div class="detail-head__body"><p class="xds-title-lg-bold">${c.name}</p><span class="detail-head__tags"><span class="chip tone-${c.tone}">${c.tag}</span><span class="xds-text-sm">${c.role}</span></span></div></div>
      <div class="actions-3">
        <button type="button" class="btn btn--block" ${btnAttr('toast', 'Calling ' + c.name + '…')}>${icon('call', 16)}Call</button>
        <button type="button" class="btn btn--bordered" ${btnAttr('toast', 'Opens Messages on device')}>Text</button>
        <button type="button" class="btn btn--bordered" ${btnAttr('toast', 'Opens Mail on device')}>Email</button>
      </div>
      <button type="button" class="ask-card ai-ring" ${btnAttr('askContact', id)}>${sparkle(24)}
        <span class="row__body"><span class="xds-text-md-bold">Catch Me Up on ${first}</span><span class="xds-text-sm ask-card__meta">Command AI summarizes activity and suggests a next step</span></span></button>
      <section class="list-group" aria-labelledby="h-details"><h2 id="h-details" class="xds-subtitle-md list-title">Details</h2>
        ${[['Mobile', c.phone], ['Email', c.email], ['Source', c.source], ['Last Contacted', c.last]].map(([l, v]) => `<div class="field-row"><span class="xds-text-sm-bold field-row__label">${l}</span><span class="xds-text-lg">${v}</span></div>`).join('')}
      </section>
      <section class="list-group" aria-labelledby="h-open-tasks"><h2 id="h-open-tasks" class="xds-subtitle-md list-title">Open Tasks</h2>
        ${tasks.length ? tasks.map((t) => `<div class="mini-task"><span class="xds-text-md">${t.title}</span><span class="badge tone-${DUE[t.due].tone}">${DUE[t.due].label}</span></div>`).join('')
          : `<p class="xds-text-md field-row" style="color:var(--label-tertiary);padding-bottom:var(--space-4)">No open tasks for this contact.</p>`}
      </section>
      <section class="card note-card" aria-labelledby="h-note"><h2 id="h-note" class="xds-subtitle-md section-label">Latest Note</h2><p class="xds-text-md">${c.note}</p></section>
    </div>
  </div>`;
}

/* ---------- Command AI (full-screen modal) ---------- */
function viewAi() {
  const ai = state.ai; const loading = ai.phase === 'loading';
  const typing = ai.phase === 'typing';
  const empty = !ai.messages.length && ai.phase === 'idle';
  const last = ai.messages[ai.messages.length - 1];
  const replies = !typing && last && last.replies;
  const showSuggestions = empty || (!typing && last && last.introEnd);
  const hasDraft = ai.draft.trim().length > 0;
  const msgs = ai.messages.map((m, i) => {
    if (m.role === 'user') return `<p class="xds-text-lg msg-user">${esc(m.text)}</p>`;
    if (m.role === 'stopped') return `<p class="xds-text-sm msg-stopped">Response stopped. Ask again or edit your question.</p>`;
    if (m.role === 'error') return `<div class="msg-error" role="alert"><span class="xds-text-md-bold msg-error__title">${icon('alert', 18)}Command AI couldn’t answer that</span>
      <span class="xds-text-md msg-error__body">Check your connection, then try again. Your question is saved.</span>
      <button type="button" class="btn btn--danger-bordered" ${btnAttr('regen', i)}>Try Again</button></div>`;
    if (m.intro) {
      const cls = `msg-ai msg-ai--intro${m.step ? ' msg-ai--rich' : ''}${once.introNew && i === ai.messages.length - 1 ? ' is-new' : ''}`;
      if (!m.step) return `<div class="${cls}"><p class="xds-text-lg msg-ai__text">${esc(m.text)}</p></div>`;
      const s = ONB_STEPS[m.step];
      return `<div class="${cls}">
        <p class="xds-subtitle-md onb__eyebrow">${s.name}</p>
        <p class="xds-title-sm-bold">${s.title}</p>
        <p class="xds-text-lg msg-ai__text">${esc(m.text)}</p>
        <div class="msg-visual">${onbStage(m.step)}</div>
        ${s.prompt ? `<div class="onb-try"><span class="xds-text-sm onb-try__label">Try asking</span><button type="button" class="onb-ask ai-ring xds-text-md" ${btnAttr('ask', s.prompt)}>${sparkle(18)}<span class="onb-ask__text">${esc(s.prompt)}</span>${icon('send', 16)}</button></div>` : ''}
      </div>`;
    }
    const fb = ai.feedback[i];
    return `<div class="msg-ai"><p class="xds-text-lg msg-ai__text">${esc(m.text)}</p>
      <div class="msg-actions" role="group" aria-label="Response actions">
        <button type="button" class="icon-btn${ai.copied === i ? ' is-on' : ''}" ${btnAttr('copy', i)} aria-label="${ai.copied === i ? 'Copied' : 'Copy response'}">${icon('copy', 20)}</button>
        <button type="button" class="icon-btn${fb === 'up' ? ' is-on' : ''}" ${btnAttr('vote', i + ':up')} aria-label="Good response" aria-pressed="${fb === 'up'}">${icon('thumbsUp', 20)}</button>
        <button type="button" class="icon-btn${fb === 'down' ? ' is-on' : ''}" ${btnAttr('vote', i + ':down')} aria-label="Bad response" aria-pressed="${fb === 'down'}">${icon('thumbsDown', 20)}</button>
        <button type="button" class="icon-btn" ${btnAttr('regen', i)} aria-label="Regenerate response">${icon('regenerate', 20)}</button>
      </div></div>`;
  }).join('');

  return `<div class="layer layer--modal${once.ai ? ' anim-rise' : ''}${ai.focused ? ' kb-open' : ''}" role="dialog" aria-modal="true" aria-labelledby="h-ai">
    ${header(`<button type="button" class="icon-btn" ${btnAttr('closeAi')} aria-label="Close Command AI">${icon('close', 18)}</button>
      <h1 id="h-ai" class="xds-title-md-bold header__title">Command AI</h1>
      ${ai.messages.length ? `<button type="button" class="icon-btn" ${btnAttr('newChat')} aria-label="New Chat">${icon('compose', 22)}</button>` : ''}
      <button type="button" class="icon-btn" ${btnAttr('sheet', 'history')} aria-label="Recent Chats">${icon('history', 22)}</button>`, { tight: true })}
    <div class="scroll ai-body" data-scroll="ai" aria-live="polite">
      ${empty ? `<div class="ai-empty">${sparkle(56, true)}<p class="xds-title-lg-bold ai-empty__title">Let’s get to work, ${DATA.agent.firstName}</p><p class="xds-text-lg ai-empty__sub">Ask about your contacts, your day, or your numbers.</p></div>` : ''}
      ${msgs}
      ${typing ? `<div class="typing" role="status" aria-label="Command AI is typing"><i></i><i></i><i></i></div>` : ''}
      ${loading ? `<div class="thinking" aria-busy="true" aria-label="Command AI is thinking"><span class="xds-text-md thinking__label">${icon('clock', 18)}Thinking…</span><span class="skeleton skeleton--line"></span><span class="thinking__pair"><span class="skeleton skeleton--line"></span><span class="skeleton skeleton--line"></span></span></div>` : ''}
    </div>
    <div class="composer-wrap">
      ${replies ? suggestionRow(replies, 'introReply') : showSuggestions ? suggestionRow(last && last.suggest) : ''}
      <div class="composer ai-ring${ai.focused ? ' is-focused' : ''}">
        <label for="ai-input" class="sr-only">Ask Command AI</label>
        ${empty
          ? `<span class="composer__field${hasDraft ? ' has-draft' : ''}"><input id="ai-input" type="text" data-input="draft" autocomplete="off" enterkeyhint="send" value="${esc(ai.draft)}">${phSpan()}</span>`
          : `<input id="ai-input" type="text" data-input="draft" placeholder="Ask a follow-up…" autocomplete="off" enterkeyhint="send" value="${esc(ai.draft)}">`}
        ${hasDraft ? '' : `<button type="button" class="icon-btn" ${btnAttr('mic')} aria-label="Dictate">${icon('mic', 22)}</button>`}
        ${loading
          ? `<button type="button" class="ai-send" ${btnAttr('stop')} aria-label="Stop response">${icon('stop', 18)}</button>`
          : `<button type="button" class="ai-send" ${btnAttr('send')} aria-label="Send"${hasDraft ? '' : ' disabled'}>${icon('send', 20)}</button>`}
      </div>
      <p class="xds-text-sm disclaimer">AI output must be reviewed for accuracy, suitability for their intended purpose, and compliance with the Fair Housing Act. <a href="https://www.hud.gov/program_offices/fair_housing_equal_opp" target="_blank" rel="noopener">Learn more.</a></p>
    </div>
    ${viewKeyboard()}
  </div>`;
}

/* Cycling placeholder prompts (Home entry + empty Command AI composer) */
const PH_PROMPTS = [
  'What should I focus on today?',
  'Who should I call first?',
  'Draft a price-reduction email for the Hendersons',
  'Prep talking points for my 3 PM listing appointment',
  'Help me respond to the Rosewood counteroffer',
  'Recap this week’s wins for my team'
];
let phIdx = 0;
const phSpan = () => `<span class="xds-text-lg ph" data-ph aria-hidden="true">${esc(PH_PROMPTS[phIdx])}</span>`;
setInterval(() => {
  if (!app.querySelector('[data-ph]')) return;
  app.querySelectorAll('[data-ph]').forEach((el) => el.classList.add('is-out'));
  setTimeout(() => {
    phIdx = (phIdx + 1) % PH_PROMPTS.length;
    app.querySelectorAll('[data-ph]').forEach((el) => {
      el.textContent = PH_PROMPTS[phIdx];
      el.classList.remove('is-out'); el.classList.add('is-in');
      void el.offsetWidth;                      // commit the start state before animating in
      el.classList.remove('is-in');
    });
  }, 380);
}, 3400);

/* Mic chime: two soft rising sine notes (E5 → A5), synthesized so no audio file is needed */
let audioCtx = null;
function chime() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t0 = audioCtx.currentTime;
    [[659.25, 0], [880, 0.09]].forEach(([freq, delay]) => {
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq;
      const t = t0 + delay;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.18, t + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t); osc.stop(t + 0.5);
    });
  } catch (e) {}
}

/* Simulated keyboard: shown while #ai-input has focus inside the desktop frame */
let kbShift = false;
function viewKeyboard() {
  const shift = kbShift || !state.ai.draft;
  const key = (k) => `<button type="button" class="kbd__key" data-key="${k}" tabindex="-1">${shift ? k.toUpperCase() : k}</button>`;
  const row = (keys) => keys.split('').map(key).join('');
  return `<div class="kbd" aria-hidden="true">
    <div class="kbd__row">${row('qwertyuiop')}</div>
    <div class="kbd__row kbd__row--mid">${row('asdfghjkl')}</div>
    <div class="kbd__row">
      <button type="button" class="kbd__key kbd__key--fn kbd__key--shift" data-key="shift" aria-pressed="${shift}" tabindex="-1">${icon('shift', 20, 1.75)}</button>
      ${row('zxcvbnm')}
      <button type="button" class="kbd__key kbd__key--fn kbd__key--del" data-key="del" tabindex="-1">⌫</button>
    </div>
    <div class="kbd__row">
      <button type="button" class="kbd__key kbd__key--wide" data-key="noop" tabindex="-1">123</button>
      <button type="button" class="kbd__key kbd__key--space" data-key=" " tabindex="-1">space</button>
      <button type="button" class="kbd__key kbd__key--wide" data-key="go" tabindex="-1">Go</button>
    </div>
    <div class="kbd__bottom">${icon('globe', 26, 1.5)}<span class="kbd__mic">${icon('mic', 26, 1.5)}</span></div>
  </div>`;
}

/* ---------- BottomSheet ---------- */
function viewSheet() {
  const actionRow = (label, action, arg, meta) => `<button type="button" class="sheet-row" ${btnAttr(action, arg)}>
    <span class="sheet-row__body"><span class="xds-text-lg">${esc(label)}</span>${meta ? `<span class="xds-text-sm sheet-row__meta">${meta}</span>` : ''}</span><span class="chev">${icon('chevronRight', 16)}</span></button>`;
  const toggleRow = (label, action, arg, on, radio) => `<button type="button" class="sheet-row" role="${radio ? 'radio' : 'checkbox'}" aria-checked="${on}" ${btnAttr(action, arg)}>
    <span class="sheet-row__body"><span class="xds-text-lg">${label}</span></span>
    <span class="mark${radio ? ' mark--radio' : ''}" aria-hidden="true">${on ? (radio ? '<span class="mark__dot"></span>' : icon('check', 14, 3)) : ''}</span></button>`;
  const sheets = {
    create: { title: 'Create', rows: ['Create Contact', 'Create Task', 'Create Opportunity', 'Log a Call'].map((l) => actionRow(l, 'create', l)).join('') },
    layout: { title: 'Manage Layout', intro: 'Choose what shows on your dashboard.', done: true,
      rows: [['tasks', 'Tasks'], ['contact', 'Who to Contact'], ['opps', 'Open Opportunities']].map(([k, l]) => toggleRow(l, 'toggleLayout', k, state.layout[k])).join('') },
    taskFilter: { title: 'Filter Tasks', rows: Object.entries(FILTERS).map(([k, l]) => toggleRow(l, 'pickFilter', k, state.taskFilter === k, true)).join('') },
    history: { title: 'Recent Chats', rows: DATA.history.map((h) => actionRow(h.q, 'openChat', h.q, h.when)).join('') }
  };
  const s = sheets[state.sheet];
  return `<div class="sheet-layer">
    <button type="button" class="sheet-scrim${once.sheet ? ' anim-fade' : ''}" ${btnAttr('closeSheet')} aria-label="Close sheet"></button>
    <div class="sheet${once.sheet ? ' anim-sheet' : ''}" role="dialog" aria-modal="true" aria-labelledby="h-sheet">
      <span class="sheet__grabber" aria-hidden="true"></span>
      <div class="sheet__head"><h2 id="h-sheet" class="xds-title-md-bold">${s.title}</h2><button type="button" class="icon-btn" ${btnAttr('closeSheet')} aria-label="Close">${icon('close', 16)}</button></div>
      ${s.intro ? `<p class="xds-text-md sheet__intro">${s.intro}</p>` : ''}
      <div class="sheet__rows" ${state.sheet === 'taskFilter' ? 'role="radiogroup" aria-label="Task filter"' : ''}>${s.rows}</div>
      ${s.done ? `<button type="button" class="btn btn--block btn--full" ${btnAttr('closeSheet')}>Done</button>` : ''}
    </div>
  </div>`;
}

/* ===================================================================
   RENDER LOOP — rebuilds #app, keeps focus, caret and scroll positions
   =================================================================== */
const app = document.getElementById('app');
const scrollMemo = {};
function render() {
  const active = document.activeElement;
  const focusId = once.focus || (active && app.contains(active) && active.id) || null;
  const caret = active && active.id && typeof active.selectionStart === 'number' ? [active.selectionStart, active.selectionEnd] : null;
  app.querySelectorAll('[data-scroll]').forEach((el) => { scrollMemo[el.dataset.scroll] = el.scrollTop; });

  const screens = { home: viewHome, contacts: viewContacts, tasks: viewTasks, opps: viewOpps, alerts: viewAlerts, menu: viewMenu };
  const top = state.stack[state.stack.length - 1];
  app.innerHTML =
    `<div class="screen-area">${screens[state.tab]()}</div>` + viewTabBar() +
    (top && top.type === 'contact' ? viewContactDetail(top.id) : '') +
    (state.ai.open ? viewAi() : '') +
    (state.sheet ? viewSheet() : '') +
    (state.onboard.open ? viewOnboard() : '') +
    (state.toast ? `<div class="toast" role="status">${esc(state.toast)}</div>` : '');

  app.querySelectorAll('[data-scroll]').forEach((el) => { if (scrollMemo[el.dataset.scroll]) el.scrollTop = scrollMemo[el.dataset.scroll]; });
  if (once.aiBottom) { const el = app.querySelector('[data-scroll="ai"]'); if (el) el.scrollTop = el.scrollHeight; }
  if (focusId && !state.sheet) {
    const el = document.getElementById(focusId);
    if (el) { el.focus({ preventScroll: true }); if (caret && el.setSelectionRange && el.id === active.id) { try { el.setSelectionRange(caret[0], caret[1]); } catch (e) {} } }
  }
  once = {};
}

/* Events: one delegated listener per type */
app.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.action];
  if (fn) { fn(el.dataset.arg); render(); }
});
app.addEventListener('input', (e) => {
  const key = e.target.dataset.input;
  if (key === 'query') state.query = e.target.value;
  if (key === 'draft') state.ai.draft = e.target.value;
  if (key) render();
});
app.addEventListener('keydown', (e) => {
  if (e.target.dataset.input === 'draft' && e.key === 'Enter' && !e.isComposing) { e.preventDefault(); askAi(state.ai.draft); render(); }
  if (e.key === 'Escape') { if (state.onboard.open) closeOnboard(); else if (state.sheet) state.sheet = null; else if (state.ai.open) actions.closeAi(); else if (state.stack.length) actions.back(); render(); }
});
app.addEventListener('focusin', (e) => { if (e.target.id === 'ai-input' && !state.ai.focused) { state.ai.focused = true; e.target.closest('.composer').classList.add('is-focused'); const l = e.target.closest('.layer'); if (!l.classList.contains('kb-open')) l.classList.add('kb-open', 'kb-enter'); } });
app.addEventListener('focusout', (e) => { if (e.target.id === 'ai-input') { state.ai.focused = false; const c = e.target.closest('.composer'); if (c) c.classList.remove('is-focused'); const l = e.target.closest('.layer'); if (l) l.classList.remove('kb-open', 'kb-enter'); } });

/* Simulated keyboard: keys never take focus, so the input (and the keyboard) stay up */
app.addEventListener('pointerdown', (e) => { if (e.target.closest('.kbd')) e.preventDefault(); });
// Mic glyphs that aren't their own buttons (Home entry, keyboard) still chime
app.addEventListener('click', (e) => { if (e.target.closest('.ai-entry__mic, .kbd__mic')) chime(); }, true);
app.addEventListener('click', (e) => {
  const k = e.target.closest('[data-key]');
  const input = document.getElementById('ai-input');
  if (!k || !input) return;
  const key = k.dataset.key;
  if (key === 'go') { askAi(state.ai.draft); render(); return; }
  if (key === 'shift') { kbShift = !(kbShift || !state.ai.draft); render(); return; }
  if (key === 'noop') return;
  const v = input.value, s = input.selectionStart ?? v.length, end = input.selectionEnd ?? v.length;
  let next, caret;
  if (key === 'del') { const from = s === end ? Math.max(0, s - 1) : s; next = v.slice(0, from) + v.slice(end); caret = from; }
  else { const ch = key.length === 1 && (kbShift || !v) ? key.toUpperCase() : key; next = v.slice(0, s) + ch + v.slice(end); caret = s + ch.length; kbShift = false; }
  input.value = next; input.setSelectionRange(caret, caret);
  state.ai.draft = next; render();
});

/* Live lead-claim countdown: updates text in place, no re-render */
setInterval(() => {
  state.claimSecs = state.claimSecs <= 0 ? 135 : state.claimSecs - 1;
  app.querySelectorAll('[data-countdown]').forEach((el) => { el.textContent = claimLabel(); });
}, 1000);

if (state.ai.open) once.ai = false;
// Onboarding appears 1.5s after the dashboard loads, unless the user has already moved on
const ONB_DELAY = 1500;
if (QA.start === 'home' && params.get('tour') !== 'off') timers.onbIntro = setTimeout(() => {
  if (state.tab !== 'home' || state.ai.open || state.sheet || state.stack.length) return;
  if (QA.onboarding === 'modal') { state.onboard.open = true; once.onbOpen = true; once.focus = 'onb-primary'; }
  else state.tour = true;
  render();
}, ONB_DELAY);
document.getElementById({ modal: 'onb-switch-modal', coachmark: 'onb-switch-coach', value: 'onb-switch-value' }[QA.onboarding]).setAttribute('aria-current', 'page');
render();
</script>
</body>
